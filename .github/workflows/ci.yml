name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-only-secret-with-enough-length-and-diversity-123456789
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
      AUTH_RATE_LIMIT_REQUESTS: 1000
      POSTGRES_PASSWORD: ci-only-database-password
      GRAFANA_ADMIN_PASSWORD: ci-only-grafana-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: bandit -r app -x app/tests
      - run: pip-audit -r requirements-dev.txt
      - run: pip-audit -r requirements-demo.txt
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest
      - run: node --check app/static/app.js
      - run: python -m json.tool observability/grafana/dashboards/stockflow-sales.json > /dev/null
      - run: docker compose config --quiet

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-only-secret-with-enough-length-and-diversity-123456789
      TEST_POSTGRES_URL: postgresql+asyncpg://stockflow:ci-test-password@localhost:5432/stockflow_test
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: stockflow
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: stockflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockflow -d stockflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Suíte integral em PostgreSQL e disputas reais por bloqueio
        run: pytest --database=postgres --evidence-dir=outputs/evidence --junitxml=outputs/postgres.xml
      - name: Guardar evidências sintéticas e relatório de testes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: postgres-evidence
          path: |
            outputs/evidence/
            outputs/postgres.xml
          retention-days: 30

  demo:
    needs: postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-demo.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: postgres-evidence
          path: outputs/postgres
      - name: Gerar vídeo e página a partir da evidência real
        run: python scripts/build_demo.py --evidence outputs/postgres/evidence/last-item-race.json
      - name: Verificar duração e decodificação do vídeo
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          import imageio_ffmpeg

          video = "outputs/site/stockflow-demo.mp4"
          frames, seconds = imageio_ffmpeg.count_frames_and_secs(video)
          assert frames == 1440 and abs(seconds - 60) < 0.1, (frames, seconds)
          probe = subprocess.run(
              [imageio_ffmpeg.get_ffmpeg_exe(), "-hide_banner", "-i", video],
              capture_output=True,
              check=False,
              text=True,
          )
          assert "Audio: aac" in probe.stderr, probe.stderr
          captions = Path("outputs/site/captions.pt-BR.vtt").read_text()
          assert "00:01:00.000" in captions
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stockflow-demo
          path: outputs/site/
          retention-days: 30
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: outputs/site/

  deploy-demo:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [quality, postgres, container, observability, demo]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar demonstração validada
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag stockflow-api:ci .
      - run: docker build --file Dockerfile.postgres --tag stockflow-postgres:ci .
      - run: >-
          docker run --rm
          --volume "$PWD/observability/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro"
          otel/opentelemetry-collector-contrib:0.159.0@sha256:1f2c54a30e713fac6b3ae77a1ec84010c2007e29ced8ec666214fc2f6739c1cc
          validate --config=/etc/otelcol-contrib/config.yaml
      - run: >-
          docker run --rm
          --entrypoint /bin/promtool
          --volume "$PWD/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
          prom/prometheus:v3.14.0-distroless@sha256:50c707e96da5ade383cb1707790576480485e93de06aa60ad8802cb5f744bd0a
          check config /etc/prometheus/prometheus.yml

  observability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: stockflow-observability-ci
      ENVIRONMENT: development
      POSTGRES_PASSWORD: ci-only-database-password
      SECRET_KEY: ci-only-secret-with-enough-length-and-diversity-123456789
      GRAFANA_ADMIN_PASSWORD: ci-only-grafana-password
      ENABLE_DOCS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Iniciar a aplicação e a stack de observabilidade
        run: docker compose up --detach --build
      - name: Aguardar os serviços
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8000/health > /dev/null && \
               curl --fail --silent http://localhost:9090/-/ready > /dev/null && \
               curl --fail --silent http://localhost:3200/ready > /dev/null && \
               curl --fail --silent http://localhost:3001/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Registrar uma venda rastreada
        run: |
          docker compose exec -T api python -m app.cli.seed_demo
          token="$(curl --fail --silent \
            --request POST http://localhost:8000/api/v1/auth/token \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'username=demo@stockflow.dev' \
            --data-urlencode 'password=Demo@StockFlow123' | jq --raw-output '.access_token')"
          test -n "$token"
          product_id="$(curl --fail --silent \
            http://localhost:8000/api/v1/products?limit=1 \
            --header "Authorization: Bearer $token" | jq --raw-output '.items[0].id')"
          test -n "$product_id"
          curl --fail --silent \
            --request POST http://localhost:8000/api/v1/sales \
            --header "Authorization: Bearer $token" \
            --header 'Content-Type: application/json' \
            --header 'X-Request-ID: ci-sale-request-001' \
            --data "{\"customer_name\":\"Cliente CI privado\",\"items\":[{\"product_id\":\"$product_id\",\"quantity\":1}]}" \
            | jq --exit-status '.status == "completed"' > /dev/null
      - name: Verificar métricas, trace, privacidade e dashboard
        run: |
          metric_found=false
          trace_found=false
          for attempt in {1..30}; do
            if curl --fail --silent --get http://localhost:9090/api/v1/query \
              --data-urlencode 'query=stockflow_sales_completed_total' \
              | jq --exit-status '.data.result | length > 0' > /dev/null; then
              metric_found=true
            fi
            if curl --fail --silent --get http://localhost:3200/api/search \
              --data-urlencode 'q={ span.request.id = "ci-sale-request-001" }' \
              | jq --exit-status '.traces | length > 0' > /dev/null; then
              trace_found=true
            fi
            if [[ "$metric_found" == true && "$trace_found" == true ]]; then
              break
            fi
            sleep 2
          done
          [[ "$metric_found" == true ]]
          [[ "$trace_found" == true ]]
          curl --fail --silent --get http://localhost:9090/api/v1/series \
            --data-urlencode 'match[]=stockflow_sales_completed_total' \
            | jq --exit-status 'all(.data[]; ((has("tenant.id") or has("tenant_id") or has("user.id") or has("customer.name") or has("product.id") or has("request.id")) | not))' \
            > /dev/null
          curl --fail --silent \
            --user "admin:$GRAFANA_ADMIN_PASSWORD" \
            http://localhost:3001/api/dashboards/uid/stockflow-sales \
            | jq --exit-status '.dashboard.uid == "stockflow-sales"' > /dev/null
      - name: Exibir logs em caso de falha
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Encerrar a stack
        if: always()
        run: docker compose down --volumes --remove-orphans
