# Isolated, disposable test database. No production volume or API credentials.
services:
  postgres-test:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: stockflow
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: stockflow_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockflow -d stockflow_test"]
      interval: 2s
      timeout: 3s
      retries: 20
